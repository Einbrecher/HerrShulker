pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    // Legacy plugin pins. fabric-loom for the Fabric subprojects; moddev for the
    // `common` subproject which uses NeoForm mappings as a vanilla-MC compile
    // check (moddev's neoFormVersion path — see common/build.gradle).
    // Modern siblings under modern/<name>/ have their own pluginManagement
    // blocks (Loom 1.16+ requires Gradle 9.4+, see modern/<name>/settings.gradle).
    plugins {
        id 'fabric-loom' version '1.13.3'
        id 'net.neoforged.moddev' version '2.0.95'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Derived from gradle.properties so a fork only needs to edit mod_id there.
rootProject.name = providers.gradleProperty('mod_id').orElse('multiloader-mod').get()

include 'common',
        'fabric-1.21.10', 'fabric-1.21.11'
