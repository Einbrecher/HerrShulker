plugins {
    id 'base'
}

apply from: 'gradle/versioning.gradle'
apply from: 'gradle/modern-orchestration.gradle'
apply from: 'gradle/fork.gradle'

subprojects {
    group = project.mod_group_id

    // Fabric maven is `exclusiveContent`-scoped to net.fabricmc.* — its artifacts
    // are scoped tightly and the scoping avoids querying it for unrelated lookups.
    repositories {
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = 'https://maven.fabricmc.net/'
                }
            }
            filter { includeGroupAndSubgroups 'net.fabricmc' }
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    // SemVer 2.0 validation is now baked into rootProject.ext.resolvedModVersion
    // via .map { check ; return v } in gradle/versioning.gradle. Every consumer
    // (archivesName, processResources expand, manifest version) trips the
    // validation at .get() time, so we no longer need a cross-project dependsOn
    // edge from each subproject's jar/remapJar to a root validation task.
}
